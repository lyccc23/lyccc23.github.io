bio: |
  I am Yichao Liu, a fourth-year undergraduate student in the Department
  of Computer Science at Tsinghua University. My research interests focus
  on world models and vision-language models. I have collaborated with
  Songjie Niu, a postdoctoral researcher in the Department of Computer
  Science, on Tree-KG, and with Sen Cui, a postdoctoral researcher in the
  Department of Automation, on RoboCoach. I look forward to exchanging
  ideas with anyone interested in these topics.

